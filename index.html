<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Varispeed</title>
  <style>
    /* A tape machine's speed control: one big number, a row of preset speeds, a fine slider. */
    :root, [data-theme="dark"] {
      --plate: #1d1f23; --panel: #282b31; --well: #141518; --edge: #363a42;
      --text: #ecebe6; --dim: #8e939c; --silk: #b9bdc5;
      --amber: #f2b13c; --slow: #6fb7ff; --normal: #6ad48a; --bad: #ff8a80; --ink: #10161d;
      color-scheme: dark;
    }
    [data-theme="grey"] {
      --plate: #4b4f56; --panel: #585d65; --well: #41454b; --edge: #6a6f78;
      --text: #f4f3ef; --dim: #c4c7cc; --silk: #dfe1e5;
      --amber: #ffc45c; --slow: #8cc8ff; --normal: #84e3a2; --bad: #ffb3a8; --ink: #1b2129;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--plate); color: var(--text); font: 13px/1.4 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-font-smoothing: antialiased; transition: background .2s; }
    button, select, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    header { display: flex; align-items: center; padding: 10px 12px 4px; gap: 8px; }
    h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 800; }
    h1 small { font-weight: 600; color: var(--dim); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }
    .theme { display: flex; background: var(--well); border: 1px solid var(--edge); border-radius: 7px; padding: 2px; }
    .theme button { width: 24px; height: 20px; border: 0; border-radius: 5px; background: none; display: grid; place-items: center; padding: 0; color: var(--dim); }
    .theme button.on { background: var(--panel); color: var(--text); }
    .theme svg { width: 12px; height: 12px; }
    select { background: var(--well); border: 1px solid var(--edge); border-radius: 6px; padding: 3px 6px; font-size: 11.5px; }
    main { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 10px; }

    .dial { background: var(--well); border: 1px solid var(--edge); border-radius: 12px; padding: 14px 12px 10px; text-align: center; }
    .big { font-size: 54px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: var(--normal); transition: color .15s; }
    .big.slow { color: var(--slow); }
    .big.fast { color: var(--amber); }
    .big.off { color: var(--dim); }
    .big span { font-size: 22px; margin-left: 2px; }
    .sub { margin-top: 6px; color: var(--silk); font-size: 12px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
    input[type=range] { width: 100%; margin: 12px 0 2px; accent-color: var(--slow); }
    .status { min-height: 1.3em; font-size: 11.5px; color: var(--dim); }
    .status.ok { color: var(--normal); }
    .status.bad { color: var(--bad); }

    .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .presets button { height: 32px; border-radius: 7px; border: 1px solid var(--edge); background: var(--panel); font-weight: 800; font-size: 12px; color: var(--silk); }
    .presets button.on { background: var(--slow); border-color: var(--slow); color: var(--ink); }
    .presets button.n.on { background: var(--normal); border-color: var(--normal); }

    .row { display: flex; gap: 6px; }
    .row button { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); font-weight: 800; }
    #toggle.on { background: var(--slow); border-color: var(--slow); color: var(--ink); }
    #reset { color: var(--normal); }

    .check { display: flex; gap: 8px; align-items: flex-start; background: var(--panel); border-radius: 10px; padding: 9px 10px; font-size: 12px; font-weight: 700; color: var(--text); cursor: pointer; }
    .check input { accent-color: var(--slow); margin: 1px 0 0; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header>
    <h1>Varispeed <small id="ver"></small></h1>
    <div class="theme">
      <button data-t="dark" id="tDark"><svg viewBox="0 0 16 16"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z" fill="currentColor"/></svg></button>
      <button data-t="grey" id="tGrey"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg></button>
    </div>
    <select id="lang"></select>
  </header>
  <main>
    <section class="dial">
      <div class="big" id="big">100<span>%</span></div>
      <div class="sub" id="sub"></div>
      <input type="range" id="slider" min="25" max="150" step="1" value="100">
      <div class="status" id="status"></div>
    </section>
    <section class="presets" id="presets"></section>
    <section class="row">
      <button id="toggle"></button>
      <button id="reset"></button>
    </section>
    <label class="check"><input type="checkbox" id="auto"><span id="autoLabel"></span></label>
  </main>
  <script src="vendor/luna.global.js"></script>
  <script src="main.js"></script>
</body>
</html>
